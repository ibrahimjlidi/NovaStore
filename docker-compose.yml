
services:
  novastore:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: novastore

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: production
      API_PORT: 3001

    ports:
      - "3001:3001"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
