stages:
  - start
  - test
  - test-finished
  - deploy
  - finish

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# ==========================================
# STAGE 1: START
# ==========================================
start-pipeline:
  stage: start
  image: alpine:latest
  script:
    - |
      echo "======================================"
      echo "       STARTING NOVASTORE CI/CD"
      echo "======================================"
      echo "Pipeline ID: $CI_PIPELINE_ID"
      echo "Branch: $CI_COMMIT_REF_NAME"
      echo "Commit: $CI_COMMIT_SHORT_SHA"

# ==========================================
# STAGE 2: TEST
# ==========================================
test:
  stage: test
  image: node:22-alpine
  script:
    - |
      set -eu

      echo "Installing dependencies..."
      npm ci

      echo "Running lint..."
      npm run lint

      echo "Running unit tests..."
      npm test

      echo "Building application..."
      npm run build

      echo "All tests passed successfully!"

# ==========================================
# STAGE 3: TEST FINISHED
# ==========================================
test-finished:
  stage: test-finished
  image: alpine:latest
  script:
    - |
      echo "======================================"
      echo "       TEST STAGE COMPLETED"
      echo "======================================"
      echo "Lint: SUCCESS"
      echo "Unit tests: SUCCESS"
      echo "Application build: SUCCESS"
      echo "Preparing OVH deployment..."

# ==========================================
# STAGE 4: DEPLOY DIRECTLY TO OVH VPS
# ==========================================
deploy-vps:
  stage: deploy
  image: alpine:3.20

  before_script:
    - apk add --no-cache openssh-client rsync
    - |
      set -eu

      echo "Checking deployment configuration..."

      test -n "$VPS_HOST"
      test -n "$VPS_USER"
      test -n "$VPS_APP_DIR"

      test -s "$VPS_SSH_PRIVATE_KEY"
      test -s "$VPS_KNOWN_HOSTS"

      chmod 600 "$VPS_SSH_PRIVATE_KEY"
      chmod 600 "$VPS_KNOWN_HOSTS"

      echo "SSH configuration is ready."

  script:
    - |
      set -eu

      SSH_OPTS="-i $VPS_SSH_PRIVATE_KEY -o UserKnownHostsFile=$VPS_KNOWN_HOSTS -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes"

      echo "======================================"
      echo "       NOVASTORE VPS DEPLOYMENT"
      echo "======================================"

      echo "Target: $VPS_USER@$VPS_HOST"
      echo "Directory: $VPS_APP_DIR"
      echo "Commit: $CI_COMMIT_SHORT_SHA"

      echo "Creating remote deployment directory..."

      ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
        "mkdir -p '$VPS_APP_DIR'"

      echo "Transferring application source..."

      rsync -az \
        --exclude='.git/' \
        --exclude='node_modules/' \
        --exclude='dist/' \
        --exclude='dist-server/' \
        --exclude='.env' \
        --exclude='.env.*' \
        --exclude='*.log' \
        --exclude='playwright-report/' \
        --exclude='test-results/' \
        -e "ssh $SSH_OPTS" \
        ./ "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"

      echo "Source transfer completed."

      echo "Building and starting NovaStore on VPS..."

      ssh $SSH_OPTS "$VPS_USER@$VPS_HOST" \
        sh -s -- "$VPS_APP_DIR" <<'REMOTE'
      set -eu

      cd "$1"

      echo "Building Docker image and starting container..."

      if ! docker compose up -d --build --remove-orphans \
        --wait --wait-timeout 180; then
        echo "Deployment or health check failed."
        docker compose logs --tail=100 || true
        exit 1
      fi

      echo "Container status:"
      docker compose ps

      echo "NovaStore deployment completed successfully."
      REMOTE

      echo "======================================"
      echo "       DEPLOYMENT SUCCESS"
      echo "======================================"

  resource_group: novastore-production

  environment:
    name: production

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ==========================================
# STAGE 5: FINISH
# ==========================================
finish-pipeline:
  stage: finish
  image: alpine:latest
  script:
    - |
      echo "======================================"
      echo "       NOVASTORE CI/CD SUCCESS"
      echo "======================================"
      echo "All pipeline stages completed!"
      echo "Deployment target: OVH VPS"
      echo "Application: http://152.228.137.85:3001"
      echo "Commit: $CI_COMMIT_SHORT_SHA"
