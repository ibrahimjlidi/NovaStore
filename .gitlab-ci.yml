stages:
  - start
  - test
  - test-finished
  - docker
  - finish

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# ==========================================
# STAGE 1: START
# ==========================================
start-pipeline:
  stage: start
  image: alpine:latest
  script:
    - |
      echo "======================================"
      echo "       STARTING NOVASTORE CI/CD"
      echo "======================================"
      echo "Pipeline ID: $CI_PIPELINE_ID"
      echo "Branch: $CI_COMMIT_REF_NAME"
      echo "Commit: $CI_COMMIT_SHORT_SHA"
      echo "Starting CI/CD process..."

# ==========================================
# STAGE 2: TEST
# ==========================================
test:
  stage: test
  image: node:22-alpine
  script:
    - |
      echo "Installing dependencies..."
      npm ci

      echo "Running lint..."
      npm run lint

      echo "Running unit tests..."
      npm test

      echo "Building application..."
      npm run build

      echo "All tests passed successfully!"

# ==========================================
# STAGE 3: TEST FINISHED
# ==========================================
test-finished:
  stage: test-finished
  image: alpine:latest
  script:
    - |
      echo "======================================"
      echo "       TEST STAGE COMPLETED"
      echo "======================================"
      echo "Lint: SUCCESS"
      echo "Unit tests: SUCCESS"
      echo "Application build: SUCCESS"
      echo "Preparing Docker build..."

# ==========================================
# STAGE 4: DOCKER BUILD AND PUSH
# ==========================================
docker-build:
  stage: docker
  image: docker:27.5.1-cli

  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false"]

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - |
      echo "Authenticating with GitLab Container Registry..."
      echo "$CI_REGISTRY_PASSWORD" | docker login \
        --username "$CI_REGISTRY_USER" \
        --password-stdin "$CI_REGISTRY"

  script:
    - |
      echo "Building NovaStore Docker image..."

      docker build --pull \
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
        -t "$CI_REGISTRY_IMAGE:latest" .

      echo "Pushing Docker image..."

      docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      docker push "$CI_REGISTRY_IMAGE:latest"

      echo "Docker image published successfully!"

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# ==========================================
# STAGE 5: FINISH
# ==========================================
finish-pipeline:
  stage: finish
  image: alpine:latest
  script:
    - |
      echo "======================================"
      echo "       NOVASTORE CI/CD SUCCESS"
      echo "======================================"
      echo "All pipeline stages completed!"
      echo "Docker image: $CI_REGISTRY_IMAGE:latest"
      echo "Commit: $CI_COMMIT_SHORT_SHA"
      echo "Ready for OVH deployment!"
